name: infra-setting
description: 'Setting Kubernetes (Minikube) infra'

runs:
  using: "composite"

  steps:
  - id: setup-go
    name: Set up Go
    uses: actions/setup-go@v7
    with:
      go-version-file: 'go.mod'
      check-latest: true
  - id: setup-kubectl
    name: Set up Kubectl
    uses: azure/setup-kubectl@v5
  - id: minikube-start
    name: Start minikube
    uses: medyagh/setup-minikube@v0.0.21
    with:
      addons: registry
      cpus: max
      memory: max
      container-runtime: docker
  - id: minikube-settings
    name: Set docker-env
    shell: bash
    run: |
      eval $(minikube -p minikube docker-env)
      NOTEST=true make images
